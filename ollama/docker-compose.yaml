services:
  server:
    image: jianshao/ollama:${ollama_image_tag-latest}
    hostname: ollama-server
    pull_policy: always
    restart: unless-stopped
    init: true
    volumes:
      - ~/.ollama:/home/devel/.ollama
      - ~/.local:/home/devel/.local
      - ~/.cache:/home/devel/.cache
      - ~/.config:/home/devel/.config
      - ~/.nvm:/home/devel/.nvm
      - ~/.copilot:/home/devel/.copilot
      - ~/.opencode:/home/devel/.opencode
    environment:
      - https_proxy
      - http_proxy
      - no_proxy
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_VULKAN=${OLLAMA_VULKAN:-0}
    ports:
      - 11434:11434
